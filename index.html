async function dbGet(key) {
  const { data } = await supa.from("app_data").select("value").eq("key", key).single();
  return data ? JSON.parse(data.value) : null;
}
async function dbSet(key, value) {
  await supa.from("app_data").upsert({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() });
}
async function uploadPhoto(path, base64) {
  // base64 → Uint8Array → Blob (fetch 없이 직접 변환)
  const b64 = base64.split(",")[1];
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i]=binary.charCodeAt(i);
  const blob = new Blob([bytes], {type:"image/jpeg"});
  const {error} = await supa.storage.from("photos").upload(path, blob, { upsert: true, contentType: "image/jpeg" });
  if(error) throw error;
}
async function getPhotoUrl(path) {
  const { data } = supa.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}
async function deletePhoto(path) {
  await supa.storage.from("photos").remove([path]);
}

            for(const sid of Object.keys(l[date])) {
              const entry=l[date][sid];
              if(entry.photoPaths&&entry.photoPaths.length) {
                entry.photos = await Promise.all(entry.photoPaths.map(p=>getPhotoUrl(p)));
              }
            }
          }
          setLessons(l);
        }
      } catch(e){ console.warn("load fail",e); }
      setLoaded(true);
    })();
  },[]);

  // ── 자동저장 (디바운스 1.5초) ─────────────────────────────
  const saveTimer2=useRef(null);
  useEffect(()=>{
    if(!loaded) return;
    clearTimeout(saveTimer2.current);
    saveTimer2.current=setTimeout(async()=>{
      setSaveStatus("saving");
      try {
        // 사진 URL 제외하고 저장 (photoPaths만 저장)
        const lessonsToSave={};
        for(const [date,day] of Object.entries(lessons)) {
          lessonsToSave[date]={};
          for(const [sid,entry] of Object.entries(day)) {
            const {photos,...rest}=entry;
            lessonsToSave[date][sid]=rest;
          }
        }
        await Promise.all([
          dbSet("students",students),
          dbSet("curriculum",curriculum),
          dbSet("lessons",lessonsToSave),
        ]);
        showSave(true);
      } catch(e){ console.warn("save fail",e); showSave(false); }
    },1500);
  },[students,curriculum,lessons,loaded]);

  // ── curriculum ─────────────────────────────────────────────
  const mk=mKey(calY,calM);
  const currList=curriculum[mk]||[];
  function setCurrList(fn){setCurriculum(p=>({...p,[mk]:fn(p[mk]||[])}));}
  function openAddCurr(){const s=fmtD(calY,calM,1),e=fmtD(calY,calM,dim(calY,calM));setCurrForm({title:"",detail:"",startDate:s,endDate:e});setCurrModal("add");}
  function openEditCurr(item){setCurrForm({title:item.title,detail:item.detail||"",startDate:item.startDate||"",endDate:item.endDate||""});setCurrModal(item);}
  function saveCurr(){
    if(!currForm.title.trim())return;
    if(currModal==="add") setCurrList(p=>[...p,{id:"c"+Date.now(),...currForm}]);
    else setCurrList(p=>p.map(c=>c.id===currModal.id?{...c,...currForm}:c));
    setCurrModal(false);
  }

  // ── lessons ────────────────────────────────────────────────
  const lessonOf=useCallback(ds=>lessons[ds]||{},[lessons]);
  function schedTimesOf(s,ds){return s.schedule.filter(sc=>sc.dow===dow(ds)).map(sc=>sc.time);}
  function dayStudents(ds){
    const d=dow(ds);
    const scheduled=[...students].filter(s=>s.schedule.some(sc=>sc.dow===d)).sort((a,b)=>{
      const ta=a.schedule.filter(sc=>sc.dow===d).map(sc=>sc.time).sort()[0]||"";
      const tb=b.schedule.filter(sc=>sc.dow===d).map(sc=>sc.time).sort()[0]||"";
      return ta.localeCompare(tb);
    });
    const day=lessonOf(ds);
    const mkIds=Object.keys(day).filter(id=>id!=="__note__"&&day[id]?.makeUp);
    const makeUp=byName(students.filter(s=>mkIds.includes(s.id)&&!scheduled.find(ss=>ss.id===s.id)));
    return{scheduled,makeUp};
  }
  function toggleAtt(ds,s){
    setLessons(prev=>{
      const day={...(prev[ds]||{})};const e=day[s.id]||{};
      const cur=e.present;let next=null,t=null;
      if(!cur){next="present";t=nowT();}else if(cur==="present"){next="absent";}
      day[s.id]={...e,present:next,time:t};return{...prev,[ds]:day};
    });
  }
  function updateLesson(ds,sid,fields){
    setLessons(prev=>{const day={...(prev[ds]||{})};day[sid]={...(day[sid]||{}),...fields};return{...prev,[ds]:day};});
  }
  function toggleProg(ds,sid,cid){
    setLessons(prev=>{
      const day={...(prev[ds]||{})};const e={...(day[sid]||{})};
      const p=e.progress?[...e.progress]:[];const i=p.indexOf(cid);
      if(i>=0)p.splice(i,1);else p.push(cid);
      day[sid]={...e,progress:p};return{...prev,[ds]:day};
    });
  }
  function addMakeUp(s){
    setLessons(prev=>{const day={...(prev[selDate]||{})};if(!day[s.id])day[s.id]={present:null,makeUp:true};return{...prev,[selDate]:day};});
    setMakeUpModal(false);
  }

  // ── 사진 업로드 → Supabase Storage ───────────────────────
  function handlePhoto(e,ds,sid){
    Array.from(e.target.files).forEach(file=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=async()=>{
          const MAX=800;let w=img.width,h=img.height;
          if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
          const cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          const base64=cv.toDataURL("image/jpeg",0.7);
          const path=`${ds}/${sid}/${Date.now()}.jpg`;
          // Supabase Storage에 업로드
          try { await uploadPhoto(path, base64); } catch(e){ console.warn("upload fail",e); }
          const url=await getPhotoUrl(path);
          setLessons(prev=>{
            const day={...(prev[ds]||{})};const en={...(day[sid]||{})};
            en.photos=[...(en.photos||[]),url];
            en.photoPaths=[...(en.photoPaths||[]),path];
            day[sid]=en;return{...prev,[ds]:day};
          });
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function removePhoto(ds,sid,i){
    setLessons(prev=>{
      const day={...(prev[ds]||{})};const en={...(day[sid]||{})};
      const path=en.photoPaths?.[i];
      if(path) deletePhoto(path).catch(()=>{});
      en.photos=(en.photos||[]).filter((_,j)=>j!==i);
      en.photoPaths=(en.photoPaths||[]).filter((_,j)=>j!==i);
      day[sid]=en;return{...prev,[ds]:day};
    });
  }

  // ── 리포트 ─────────────────────────────────────────────────
  function genReport(s){
    const wr=weekRange(selDate),dates=weekDates(wr.start);
    const wl=dates.map(d=>({date:d,entry:(lessons[d]||{})[s.id]||null})).filter(x=>x.entry);
    const smk=mKey(new Date(selDate+"T00:00:00").getFullYear(),new Date(selDate+"T00:00:00").getMonth());
    const mc=curriculum[smk]||[];
    const fn=s.name.slice(1);
    const allProgs=[...new Set(wl.flatMap(x=>(x.entry.progress||[]).map(id=>mc.find(c=>c.id===id)?.title).filter(Boolean)))];
    const allDetails=[...new Set(wl.flatMap(x=>(x.entry.progress||[]).map(id=>mc.find(c=>c.id===id)?.detail).filter(Boolean)))];
    const allMemos=wl.map(x=>x.entry.memo).filter(Boolean);
    const allPhotos=wl.flatMap(x=>x.entry.photos||[]);
    const pt=allProgs.length===0?"다양한 미술 활동":allProgs.length===1?allProgs[0]:allProgs.slice(0,-1).join(", ")+", "+allProgs[allProgs.length-1];
    const en=josa(fn,"은","는");const er=josa(pt[pt.length-1]||"","을","를");
    const rawParts=[...allDetails,...allMemos];
    let mid="";
    if(rawParts.length>0){
      mid=rawParts.map(txt=>{
        const t=txt.trim().replace(/\.$/,"");
        if(/[요다]$/.test(t)) return t;
        const c=t.replace(/했음$/,"했어요").replace(/임$/,"이에요").replace(/함$/,"했어요").replace(/됨$/,"됐어요").replace(/좋았음$/,"좋았어요").replace(/힘들었음$/,"힘들었어요");
        if(c!==t) return fn+josa(fn,"이","가")+" "+c;
        return fn+josa(fn,"이","가")+" "+t+"을 했어요";
      }).join(" ");
    } else {
      mid=[fn+josa(fn,"이","가")+" 한 주도 열심히 참여해줬어요 😊",fn+josa(fn,"이","가")+" 작품에 집중하는 모습이 보기 좋았어요 🎨",fn+josa(fn,"이","가")+" 즐겁게 수업에 임해줬어요 ✨"][Math.floor(Math.random()*3)];
    }
    setReportStu(s);setReportTxt("안녕하세요~ 이번 주 "+fn+en+" "+pt+er+" 진행했습니다.\n"+mid+"\n이번주 사진 보내드립니다!☺️");setReportPhotos(allPhotos);setReportModal(true);
  }

  // ── 학생 관리 ──────────────────────────────────────────────
  function openAddStu(){setSForm({name:"",grade:"초1",color:COLORS[0],schedule:[]});setEditStuId(null);setStuModal(true);}
  function openEditStu(s){setSForm({name:s.name,grade:s.grade,color:s.color,schedule:[...s.schedule]});setEditStuId(s.id);setStuModal(true);}

  function saveStu(){
    if(!sForm.name.trim())return;
    if(editStuId) setStudents(p=>byName(p.map(s=>s.id===editStuId?{...s,...sForm}:s)));
    else setStudents(p=>byName([...p,{id:"s"+Date.now(),...sForm}]));
    setStuModal(false);
  }

    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F7F3EE",fontFamily:"system-ui"}}>

      <div style={{fontSize:13,color:"#9C7E62"}}>데이터 불러오는 중...</div>
    </div>

  const perDigital={};students.forEach(s=>{perDigital[s.id]=0;});
  monthLessons.forEach(([,day])=>{Object.entries(day).forEach(([sid,e])=>{

                    {new Date(selDate+"T00:00:00").getMonth()+1}월 {new Date(selDate+"T00:00:00").getDate()}일
                  </span>
                  {HOLIDAYS[selDate]&&<span style={{fontSize:11,fontWeight:700,color:"#fff",background:"#E05050",borderRadius:8,padding:"2px 8px"}}>{HOLIDAYS[selDate]}</span>}
                </div>
                <div style={{fontSize:12,color:"#9C7E62",marginTop:2}}>{DAYS[dow(selDate)]}요일</div>
              </div>
              <button className="btn bo" style={{fontSize:12,padding:"8px 14px"}} onClick={()=>setMakeUpModal(true)}>+ 보강 추가</button>
            </div>
            <div style={{marginBottom:14}}>
              <textarea value={(dayLesson["__note__"]?.memo)||""} onChange={e=>setLessons(prev=>{const day={...(prev[selDate]||{})};day["__note__"]={memo:e.target.value};return{...prev,[selDate]:day};})}
                placeholder="📌 오늘 수업 전달사항, 준비물, 특이사항..."
                style={{width:"100%",padding:"12px 14px",border:"2px solid #EDE5DA",borderRadius:14,fontFamily:"system-ui,sans-serif",fontSize:13,color:"#1E1207",background:"#FFFBF5",outline:"none",resize:"none",lineHeight:1.6,minHeight:72}}
                onFocus={e=>e.target.style.borderColor="#E8500A"} onBlur={e=>e.target.style.borderColor="#EDE5DA"}/>
            </div>
            {dayAll.length===0?(
              <div className="card" style={{textAlign:"center",padding:"40px 20px",color:"#9C7E62"}}><div style={{fontSize:40,marginBottom:10}}>🖌️</div><div style={{fontWeight:700,marginBottom:4}}>오늘 스케줄된 학생이 없어요</div><div style={{fontSize:13}}>보강 추가 버튼으로 학생을 추가할 수 있어요</div></div>
            ):dayAll.map(s=>{
              const entry=dayLesson[s.id]||{},att=entry.present,isMU=dayMakeUp.includes(s);
              const times=schedTimesOf(s,selDate),isOpen=!!openCards[s.id];
              return(
                <div key={s.id} className="sc" style={{borderLeft:"4px solid "+s.color}}>
                  <div className="sch" onClick={()=>setOpenCards(p=>({...p,[s.id]:!p[s.id]}))}>
                    <div className="av" style={{background:s.color+"22",border:"2px solid "+s.color,color:s.color}}>{s.name[0]}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:14}}>{s.name}</span>
                        <span style={{fontSize:11,color:"#9C7E62"}}>{s.grade}</span>
                        {isMU?<span className="tmk">보강</span>:<span className="trg">정규</span>}
                      </div>
                      {times.length>0&&<div style={{fontSize:11,color:"#9C7E62",marginTop:1}}>스케줄 {times.join(", ")}</div>}
                      {!isOpen&&(entry.progress||[]).length>0&&(
                        <div style={{fontSize:10,color:"#C4B5A5",marginTop:2,lineHeight:1.3}}>
                          {(entry.progress||[]).map(id=>selCurr.find(c=>c.id===id)?.title).filter(Boolean).join(" · ")}
                        </div>
                      )}
                    </div>
                    <div onClick={e=>e.stopPropagation()} style={{display:"flex",alignItems:"center",gap:6}}>
                      {att==="present"&&<TimeEdit time={entry.time} onSave={t=>updateLesson(selDate,s.id,{time:t})}/>}
                      <button className={"ab"+(att==="present"?" p":att==="absent"?" a":"")} onClick={()=>toggleAtt(selDate,s)}>
                        <span>{att==="present"?"✅":att==="absent"?"❌":"⭕"}</span>
                        <span>{att==="present"?"출석":att==="absent"?"결석":"미정"}</span>
                      </button>
                    </div>
                    <span className={"chv"+(isOpen?" o":"")}>▼</span>
                  </div>
                  {isOpen&&(
                    <div className="scb" style={{paddingTop:12}}>
                      <div className="fg">
                        <label className="lbl">진도 ({MONTHS[new Date(selDate+"T00:00:00").getMonth()]} 진도표)</label>
                        {selCurr.length===0?(
                          <div style={{fontSize:12,color:"#9C7E62",padding:"4px 0"}}>캘린더 탭에서 이달의 진도 항목을 먼저 추가해주세요</div>
                        ):(
                          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                            {selCurr.map(c=>{const sel=(entry.progress||[]).includes(c.id);return <div key={c.id} className={"pill"+(sel?" ong":"")} onClick={()=>toggleProg(selDate,s.id,c.id)}>{c.title}</div>;})}
                          </div>
                        )}
                      </div>
                      <div className="fg">
                        <label className="lbl">선생님 메모</label>
                        <textarea className="inp" placeholder="태도, 참여도, 특이사항..." value={entry.memo||""} onChange={e=>updateLesson(selDate,s.id,{memo:e.target.value})}/>
                      </div>
                      <div className="fg" style={{marginBottom:0}}>
                        <label className="lbl">작품 사진</label>
                        <input type="file" accept="image/*" multiple id={"ph_"+s.id} style={{display:"none"}} onChange={e=>handlePhoto(e,selDate,s.id)}/>
                        <label htmlFor={"ph_"+s.id} style={{display:"block",padding:"10px",border:"2px dashed #EDE5DA",borderRadius:10,textAlign:"center",cursor:"pointer",fontSize:12,color:"#9C7E62"}}>📸 사진 추가</label>
                        {(entry.photos||[]).length>0&&(
                          <div className="pg">
                            {entry.photos.map((src,i)=>(
                              <div key={i} style={{position:"relative"}}>
                                <img src={src} className="pt" alt=""/>
                                <button onClick={()=>removePhoto(selDate,s.id,i)} style={{position:"absolute",top:2,right:2,background:"rgba(255,255,255,.8)",border:"none",borderRadius:"50%",width:16,height:16,fontSize:9,cursor:"pointer"}}>✕</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab==="report"&&(
          <div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:22,fontWeight:900,color:AC,marginBottom:3,letterSpacing:"-0.5px"}}>✨ 학부모 리포트</div>
              <div style={{fontSize:12,color:"#9C7E62"}}>선택 날짜 기준 해당 주(월~토) 메모·진도를 조합해 작성합니다</div>
            </div>
            <div className="card" style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📅 기준 주차</div>
              {(()=>{const wr=weekRange(selDate);return(
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{background:AC,color:"#fff",borderRadius:10,padding:"4px 12px",fontSize:12,fontWeight:700}}>{wr.start}</span>
                  <span style={{color:"#9C7E62"}}>~</span>
                  <span style={{background:AC,color:"#fff",borderRadius:10,padding:"4px 12px",fontSize:12,fontWeight:700}}>{wr.end}</span>
                </div>
              )})()}
              <div style={{fontSize:11,color:"#9C7E62",marginTop:8}}>날짜 변경은 캘린더 탭에서 날짜를 선택하세요</div>
            </div>
            <div className="card">
              <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>👨‍🎨 학생 선택</div>
              {byName(students).map(s=>(
                <div key={s.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",borderRadius:12,border:"2px solid #EDE5DA",marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:9}}>
                    <div className="av" style={{background:s.color+"22",border:"2px solid "+s.color,color:s.color}}>{s.name[0]}</div>
                    <div><div style={{fontWeight:700,fontSize:13}}>{s.name}</div><div style={{fontSize:11,color:"#9C7E62"}}>{s.grade}</div></div>
                  </div>
                  <button className="btn bp" style={{fontSize:12,padding:"8px 14px"}} onClick={()=>genReport(s)}>생성</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="manage"&&(
          <div>
            <div className="card" style={{marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>☁️ 자동저장 안내</div>
              <div style={{fontSize:12,color:"#9C7E62",lineHeight:1.6}}>모든 데이터는 Supabase 클라우드에 자동저장됩니다. 사진도 영구 보관되어 기기 원본을 삭제해도 앱에 남아있어요.</div>
            </div>
            <div className="card">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:14}}>👤 학생 관리 <span style={{fontWeight:400,color:"#9C7E62",fontSize:12}}>({students.length}명)</span></div>
                <button className="btn bp" style={{fontSize:12,padding:"8px 14px"}} onClick={openAddStu}>+ 추가</button>
              </div>
              {byName(students).map(s=>(
                <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #EDE5DA"}}>
                  <div className="av" style={{background:s.color+"22",border:"2px solid "+s.color,color:s.color}}>{s.name[0]}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13}}>{s.name} <span style={{fontWeight:400,color:"#9C7E62",fontSize:11}}>{s.grade}</span></div>
                    <div style={{fontSize:11,color:"#9C7E62",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {s.schedule.length>0?[...s.schedule].sort((a,b)=>a.dow-b.dow||a.time.localeCompare(b.time)).map(sc=>DAYS[sc.dow]+" "+sc.time).join(" · "):"스케줄 없음"}
                    </div>
                  </div>
                  <button className="btn bg" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>openEditStu(s)}>편집</button>
                  <button className="btn" style={{fontSize:11,padding:"6px 10px",background:"#FFE8E8",color:"#D44"}} onClick={()=>setStudents(p=>p.filter(x=>x.id!==s.id))}>삭제</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {currModal&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setCurrModal(false)}>
          <div className="sheet">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontSize:18,fontWeight:900,color:AC}}>{currModal==="add"?"진도 항목 추가":"진도 항목 편집"}</div>
              <button onClick={()=>setCurrModal(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9C7E62"}}>✕</button>
            </div>
            <div className="fg"><label className="lbl">진도 이름 *</label><input className="inp" placeholder="예: 수채화 기초" value={currForm.title} onChange={e=>setCurrForm(p=>({...p,title:e.target.value}))}/></div>
            <div className="fg"><label className="lbl">상세 내용</label><textarea className="inp" placeholder="목표, 세부 내용 등" value={currForm.detail} onChange={e=>setCurrForm(p=>({...p,detail:e.target.value}))}/></div>
            <div className="fg"><label className="lbl">기간</label>
              <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center"}}>
                <input type="date" className="inp" value={currForm.startDate} onChange={e=>setCurrForm(p=>({...p,startDate:e.target.value}))}/>
                <span style={{color:"#9C7E62",fontSize:13,textAlign:"center"}}>~</span>
                <input type="date" className="inp" value={currForm.endDate} onChange={e=>setCurrForm(p=>({...p,endDate:e.target.value}))}/>
              </div>
            </div>
            <button className="btn bp" style={{width:"100%",padding:"13px"}} onClick={saveCurr}>저장</button>
            {currModal!=="add"&&(
              <button className="btn" style={{width:"100%",marginTop:8,padding:"12px",background:"#FFE8E8",color:"#D44"}}
                onClick={()=>{setCurrList(p=>p.filter(x=>x.id!==currModal.id));setCurrModal(false);}}>
                🗑 진도 항목 삭제
              </button>
            )}
          </div>
        </div>
      )}

      {stuModal&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setStuModal(false)}>
          <div className="sheet">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontSize:18,fontWeight:900,color:AC}}>{editStuId?"학생 편집":"학생 추가"}</div>
              <button onClick={()=>setStuModal(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9C7E62"}}>✕</button>
            </div>
            <div className="fg"><label className="lbl">이름</label><input className="inp" placeholder="학생 이름" value={sForm.name} onChange={e=>setSForm(p=>({...p,name:e.target.value}))}/></div>
            <div className="fg"><label className="lbl">학년</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {["초1","초2","초3","초4","초5","초6"].map(g=><div key={g} className={"pill"+(sForm.grade===g?" on":"")} onClick={()=>setSForm(p=>({...p,grade:g}))}>{g}</div>)}
              </div>
            </div>
            <div className="fg"><label className="lbl">색상</label>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {COLORS.map(c=><div key={c} onClick={()=>setSForm(p=>({...p,color:c}))} style={{width:28,height:28,borderRadius:8,background:c,cursor:"pointer",border:sForm.color===c?"3px solid #333":"3px solid transparent",transition:".15s"}}/>)}
              </div>
            </div>
            <div className="fg">
              <label className="lbl">정규 수업 요일/시간</label>
              {sForm.schedule.length>0&&(
                <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
                  {[...sForm.schedule].sort((a,b)=>a.dow-b.dow||a.time.localeCompare(b.time)).map((sc,idx)=>(
                    <span key={sc.id||idx} className="chip" style={{background:"rgba(61,191,184,.13)",color:"#1B8F8A",border:"1.5px solid #3DBFB8"}}>
                      {DAYS[sc.dow]+" "+sc.time}
                      <span style={{cursor:"pointer",marginLeft:3}} onClick={()=>setSForm(p=>({...p,schedule:p.schedule.filter(x=>x!==sc)}))}>✕</span>
                    </span>
                  ))}
                </div>
              )}
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <select className="inp" style={{flex:"0 0 auto",width:90}} value={sDow} onChange={e=>setSDow(Number(e.target.value))}>
                  {[1,2,3,4,5,6].map(d=><option key={d} value={d}>{DAYS[d]}요일</option>)}
                </select>
                <input type="time" className="inp" style={{flex:1}} value={sTime} onChange={e=>setSTime(e.target.value)}/>
                <button className="btn bp" style={{whiteSpace:"nowrap",padding:"10px 12px",flexShrink:0}} onClick={addSchedSlot}>추가</button>
              </div>
            </div>
            <button className="btn bp" style={{width:"100%",marginTop:4,padding:"13px"}} onClick={saveStu}>저장</button>
          </div>
        </div>
      )}

      {makeUpModal&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setMakeUpModal(false)}>
          <div className="sheet">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontSize:18,fontWeight:900,color:AC}}>보강 학생 추가</div>
              <button onClick={()=>setMakeUpModal(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9C7E62"}}>✕</button>
            </div>
            <div style={{fontSize:12,color:"#9C7E62",marginBottom:12}}>이날 정규 스케줄이 없는 학생을 보강으로 추가합니다</div>
            {byName(students.filter(s=>!daySched.includes(s))).map(s=>(
              <div key={s.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 12px",borderRadius:12,border:"2px solid #EDE5DA",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:9}}>
                  <div className="av" style={{background:s.color+"22",border:"2px solid "+s.color,color:s.color}}>{s.name[0]}</div>
                  <div style={{fontWeight:700,fontSize:13}}>{s.name} <span style={{color:"#9C7E62",fontWeight:400,fontSize:11}}>{s.grade}</span></div>
                </div>
                <button className="btn bp" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>addMakeUp(s)}>추가</button>
              </div>
            ))}
            {students.filter(s=>!daySched.includes(s)).length===0&&<p style={{textAlign:"center",color:"#9C7E62",fontSize:13,padding:"20px 0"}}>모든 학생이 이미 이날 스케줄에 있어요</p>}
          </div>
        </div>
      )}

      {reportModal&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setReportModal(false)}>
          <div className="sheet">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:18,fontWeight:900,color:AC}}>✨ 리포트</div>
              <button onClick={()=>setReportModal(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9C7E62"}}>✕</button>
            </div>
            {reportStu&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                <div className="av" style={{background:reportStu.color+"22",border:"2px solid "+reportStu.color,color:reportStu.color}}>{reportStu.name[0]}</div>
                <span style={{fontWeight:700}}>{reportStu.name}</span>
                <span style={{fontSize:11,color:"#9C7E62"}}>{reportStu.grade}</span>
                {(()=>{const wr=weekRange(selDate);return <span style={{marginLeft:"auto",background:AC,color:"#fff",borderRadius:9,padding:"3px 10px",fontSize:11,fontWeight:700}}>{wr.start+"~"+wr.end}</span>;})()}
              </div>
            )}
            <div style={{background:"linear-gradient(135deg,#FFF8F0,#FFF3E8)",borderLeft:"4px solid #E8500A",padding:"14px 16px",borderRadius:"0 14px 14px 0",lineHeight:1.8,fontSize:14,whiteSpace:"pre-wrap",marginBottom:12}}>{reportTxt}</div>
            <div style={{display:"flex",gap:8,marginBottom:reportPhotos.length>0?12:0}}>
              <button className="btn" style={{background:"#3DBFB8",color:"#fff",fontSize:12,padding:"9px 14px"}} onClick={()=>navigator.clipboard?.writeText(reportTxt)}>📋 텍스트 복사</button>
              <button className="btn bo" style={{flex:1,fontSize:12}} onClick={()=>genReport(reportStu)}>🔄 다시 생성</button>
            </div>
            {reportPhotos.length>0&&(
              <div>
                <div style={{fontSize:12,fontWeight:700,color:"#9C7E62",marginBottom:8}}>{"📸 이번 주 사진 ("+reportPhotos.length+"장)"}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
                  {reportPhotos.map((src,i)=>(
                    <div key={i} style={{position:"relative"}}>
                      <img src={src} style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:10}} alt=""/>
                      <a href={src} download={"작품_"+(i+1)+".jpg"} target="_blank" rel="noreferrer"
                        style={{position:"absolute",bottom:4,right:4,background:"rgba(0,0,0,.55)",color:"#fff",borderRadius:6,padding:"2px 6px",fontSize:10,fontWeight:700,textDecoration:"none"}}>저장</a>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
